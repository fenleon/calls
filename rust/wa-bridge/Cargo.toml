[package]
name = "wa-bridge"
version = "0.1.0"
edition = "2021"

[lib]
name = "wa_bridge"
crate-type = ["cdylib", "rlib"]

[dependencies]
whatsapp-rust = { version = "0.7", features = ["voip"] }
# Direct wacore dep (same source the patch below funnels whatsapp-rust to):
# the keyframe-pressure relay matches on `RtcpFeedback`/`RTCP_PT_PSFB`.
wacore = { path = "../whatsapp-rust/wacore" }
log = { version = "0.4", features = ["std"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }
uniffi = { version = "0.29", features = ["cli"] }

# Local fork: call-log app-state mutations surfaced as CallLogUpdate events
# (upstream drop); branch `call-log-sync`, see calls WORKLOG.
[patch.crates-io]
whatsapp-rust = { path = "../whatsapp-rust" }
wacore = { path = "../whatsapp-rust/wacore" }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[build-dependencies]
uniffi = { version = "0.29", features = ["build"] }

[target.'cfg(target_os = "android")'.dependencies]
android_log-sys = "0.3"

[dev-dependencies]
futures = "0.3"
